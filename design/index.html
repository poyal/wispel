<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>위스펠 · 접은 쪽지와 Mosaic 종합 시안</title>
  <link rel="icon" href="icons/09-note.png">
  <link rel="stylesheet" href="board.css">
  <script defer src="board.js"></script>
</head>
<body>
  <header class="mast"><a href="index.html" class="brand" aria-label="위스펠 디자인 홈">Wispel</a><span class="mast-sub">종합 시안</span><a class="plan-link" href="../plan.md">프로젝트 계획 ↗</a></header>
  <main>
    <section class="identity">
      <a href="icons/09-note.png" aria-label="접은 쪽지 아이콘 원본 열기"><img class="app-master" src="icons/09-note.png" alt="짙은 초록 바탕에 오른쪽 아래를 접은 노란 쪽지"></a>
      <div><p>앱 아이콘 09 · 화면 디자인 04</p><h1>접은 쪽지 <span>×</span> Mosaic</h1></div>
      <ul class="identity-colors" aria-label="아이콘 대표 색상">
        <li><i class="tone-green"></i>바탕 <code>#043D2B</code></li>
        <li><i class="tone-yellow"></i>앞면 <code>#FDD863</code></li>
        <li><i class="tone-cream"></i>접힌 면 <code>#FBF0DC</code></li>
      </ul>
    </section>
    <section id="gallery" class="approved" aria-label="Mosaic 주요 화면"></section>
    <section class="diagnostics-strip" aria-label="읽기 전용 점검 웹 요약 예시">
      <a href="diagnostics.html">Windows · 전달 상태 ↗</a>
      <span>서비스 <b>실행 중</b></span><span>발송 대기 <b>1건</b></span><span>최근 1시간 오류 <b>1건</b></span>
    </section>
    <footer>Wispel <span>·</span> 예시 데이터로 동작하는 화면 시안입니다.</footer>
  </main>
  <dialog id="detail" aria-labelledby="detail-heading">
    <div class="dialog-body">
      <div class="detail-info"><button id="close" class="back">← 전체 화면</button><h2 id="detail-heading"></h2><p id="detail-copy"></p><div id="detail-views" class="detail-views" role="group" aria-label="화면 선택"></div><p class="detail-note">시안에서 바꾼 설정은 이 페이지에서만 적용됩니다.</p></div>
      <div id="detail-stage"></div>
    </div>
  </dialog>
  <dialog id="sheet" aria-labelledby="sheet-title"><div id="sheet-content"></div><button class="sheet-close">닫기</button></dialog>
</body>
</html>
