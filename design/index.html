<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Wispel · 디자인 시안</title>
  <link rel="stylesheet" href="board.css">
  <script defer src="board.js"></script>
</head>
<body>
  <header class="mast"><a href="index.html" class="brand" aria-label="위스펠 디자인 보드 홈"><span class="brand-mark" aria-hidden="true">w</span>Wispel</a><span class="mast-sub">디자인 보드</span><a class="plan-link" href="../plan.md">프로젝트 계획 ↗</a></header>
  <main>
    <section class="intro"><div><h1>위스펠 디자인 시안</h1><p>서브폰의 알림이 본폰과 손목에 닿는 다섯 가지 방식</p></div><div class="view-bar" id="views" role="group" aria-label="비교할 화면"></div></section>
    <section id="gallery" aria-label="다섯 가지 디자인 시안"></section>
    <footer>Wispel <span>·</span> 예시 데이터로 동작하는 화면 시안입니다.</footer>
  </main>
  <dialog id="detail" aria-labelledby="detail-heading">
    <div class="dialog-body">
      <div class="detail-info"><button id="close" class="back">← 전체 시안</button><h2 id="detail-heading"></h2><p id="detail-copy"></p><div id="detail-views" class="detail-views" role="group" aria-label="시안 화면 선택"></div><p class="detail-note">시안에서 바꾼 설정은 이 페이지에서만 적용됩니다.</p></div>
      <div id="detail-stage"></div>
    </div>
  </dialog>
  <dialog id="sheet" aria-labelledby="sheet-title"><div id="sheet-content"></div><button class="sheet-close">닫기</button></dialog>
</body>
</html>
